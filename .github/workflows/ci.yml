# .github/workflows/ci.yml
name: CI Pipeline — Análisis de Sentimiento

on:
  push:
    branches: [Analizador-Sentimientos]
  pull_request:
    branches: [Analizador-Sentimientos]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno de ejecución
      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Cachear dependencias para acelerar el pipeline
      - name: Cache de dependencias
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      # 4. Instalar librerías necesarias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 bandit

      # 5. Linting (Calidad de código)
      - name: Ejecutar Linter (Flake8)
        run: |
          # Detener el build si hay errores de sintaxis o variables no definidas
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # 6. Seguridad (Bandit)
      - name: Escaneo de seguridad
        run: |
          bandit -r sentimiento/ -ll

      # 7. Crear estructura de directorios necesaria
      - name: Preparar entorno de resultados
        run: |
          mkdir -p resultados/json
          mkdir -p resultados/txt

      # 8. Ejecutar Tests y generar reporte de cobertura
      - name: Ejecutar tests unitarios con Pytest
        env:
          OPENAI_API_KEY: "ollama" # Clave simulada para tests
        run: |
          python -m pytest --cov=sentimiento Sentimiento/tests/ --cov-report=xml

      # 9. (Opcional) Subir reporte de cobertura
      - name: Subir artefactos de los tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura
          path: coverage.xml