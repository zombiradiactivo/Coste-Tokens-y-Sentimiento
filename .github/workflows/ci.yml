name: CI de Calculadora de Costes

on:
    push:
        branches: [ Costes-Tokens ]
    pull_request:
        branches: [ Costes-Tokens ]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout del código
              uses: actions/checkout@v4

            - name: Configurar Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
            - name: Instalar dependencias
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install ruff pytest pytest-cov bandit

            - name: Ejecutar Linter (Ruff)
              run: ruff check .

            - name: Análisis de seguridad (Bandit)
              run: bandit -r core/

            - name: Ejecutar Tests con Cobertura
              run: |
                    pytest --cov=core Costes_Token/tests/ --cov-report=xml